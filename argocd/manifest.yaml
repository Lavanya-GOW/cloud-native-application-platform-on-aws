project: default
source:
  repoURL: https://github.com/Lavanya-GOW/cloud-native-application-platform-on-aws
  path: kubernetes-files
  targetRevision: HEAD
  directory:
    recurse: true
destination:
  server: https://kubernetes.default.svc
  namespace: three-tier-app
syncPolicy:
  automated:
    prune: true
    selfHeal: true
    enabled: true
